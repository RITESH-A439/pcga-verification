<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PC Gaming Academy — Email Verification</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f16;color:#f5f7fb;font-family:Arial,sans-serif;padding:20px}
.card{max-width:560px;width:100%;background:#151b25;border:1px solid #2b3546;border-radius:22px;padding:32px;text-align:center;box-shadow:0 20px 60px #0007}
h1{margin:0 0 10px}p{color:#aeb8c9;line-height:1.5}.status{padding:16px;border-radius:12px;background:#10151e;border:1px solid #293343;margin:20px 0}.good{color:#35d07f}.bad{color:#ff657a}.small{font-size:13px;color:#7f8ba0}
</style>
</head>
<body><main class="card"><h1>🎮 PC GAMING ACADEMY</h1><h2 id="title">Checking your email...</h2><div id="status" class="status">Please wait.</div><p id="detail"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient('https://wpqcwqjcmugzcyrunsli.supabase.co','sb_publishable_ZBNVPib-Rrh4TWMfxDS8HQ_9RWlKm6B',{auth:{persistSession:true,detectSessionInUrl:true}});
(async()=>{
 const status=document.getElementById('status'),title=document.getElementById('title'),detail=document.getElementById('detail');
 const hash=new URLSearchParams(location.hash.slice(1));
 const err=hash.get('error_description')||new URLSearchParams(location.search).get('error_description');
 if(err){title.textContent='❌ Verification failed';status.className='status bad';status.textContent=decodeURIComponent(err.replace(/\+/g,' '));return;}
 const {data:{session}}=await supabase.auth.getSession();
 if(session?.user?.email_confirmed_at){title.textContent='✅ Email Verified';status.className='status good';status.textContent='Your PCGA email has been verified successfully.';detail.textContent='Return to the PC Gaming Academy app and sign in with your email and password.';return;}
 const {data:{user}}=await supabase.auth.getUser();
 if(user?.email_confirmed_at){title.textContent='✅ Email Verified';status.className='status good';status.textContent='Your PCGA email has been verified successfully.';detail.textContent='Return to the PC Gaming Academy app and sign in.';return;}
 title.textContent='⚠️ Verification incomplete';status.className='status bad';status.textContent='The verification session could not be confirmed.';detail.textContent='Please use the newest verification email and try again.';
})();
</script></body></html>
